<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Сон о Садко — игра мальчика Елисея">
    <meta property="og:description" content="Детская HTML5-игра по мотивам былины о Садко. Мальчик Елисей засыпает с книгой и попадает в мир Древнего Новгорода.">
    <meta property="og:image" content="https://evgenykutuzov.github.io/elisey-sadko-game/novgorod_map_start.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin:0; padding:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
        canvas { display:block; margin:auto; touch-action: none; user-select: none; }
    </style>
</head>
<body>
<script>
var config = {
    type: Phaser.AUTO,
    width: 400,
    height: 700,
    backgroundColor: '#000000',
    render: { roundPixels: true, antialias: true, pixelArt: false },
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        autoRound: true
    },
    audio: { disableWebAudio: false },
    scene: { preload: preloadAssets, create: createGame }
};

var game = new Phaser.Game(config);
var bgMusic = null;
var musicOn = true;
var musicBtn = null;

var playerContainer;
var dialogContainer = null;
var playButton;
var isMoving = false;
var lastPlayerLoc = null;
var mapHintText = null;

var artifactCollected = { uzelok: false, rakuska: false, krestik: false };
var secretFound = false;

var locations = [
    { name:'Причал',        x:160, y:510, unlocked:true,  completed:false, targetType:'bochki',  targetCount:9,  icon:'prichal_icon',    puzzleBg:'prichal_puzzle', isReturn: false },
    { name:'За рекой',      x:350, y:130, unlocked:false, completed:false, targetType:'gusli',   targetCount:9,  icon:'za_rekoy_icon',   puzzleBg:'za_rekoy_puzzle', isReturn: false },
    { name:'Великий Новгород', x:120, y:110, unlocked:false, completed:false, targetType:'kamen', targetCount:15, icon:'novgorod_icon',  puzzleBg:'novgorod_puzzle', isReturn: false }
];
var currentLocation = null;
var livesText, lives=5, maxLives=5;

var puzzleActive = false;
var ROWS=5, COLS=5, CELL_SIZE=80;
var TYPES = {
    bochki:  { name:'Бочки',   img:'bochki55',   plural:'бочек' },
    gusli:   { name:'Струны и колки', img:'gusli55',    plural:'струн и колков' },
    kamen:   { name:'Камни',   img:'kirpich55',  plural:'камней' },
    pero:    { name:'Перо',    img:'pero55',     plural:'перьев' },
    pisalo:  { name:'Писало',  img:'pisalo55',   plural:'писал' }
};
var TYPE_KEYS = Object.keys(TYPES);
var grid = [];
var targetType=null, targetCount=0, collectedCount=0, scoreText;
var movesLeft=25, movesText;

var dragIcon = null;
var dragStartX=0, dragStartY=0;
var dragPointerStartX=0, dragPointerStartY=0;
var dragLocked = false;

var firstMoveMade = false;
var highlightFrames = [];
var finalDialogShown = false;

var idleTimer = null;
var idleCloud = null;
var idleActive = false;

var puzzleIdleTimer = null;
var puzzleHintHighlights = [];

function preloadAssets() {
    var progressBox = this.add.graphics();
    progressBox.fillStyle(0x222222, 0.8);
    progressBox.fillRect(80, 320, 240, 50);

    var loadingText = this.add.text(200, 300, 'Загрузка...', {
        fontSize:'18px', fill:'#ffffff', fontFamily:'Comfortaa, Arial'
    }).setOrigin(0.5);

    var progressBar = this.add.graphics();

    this.load.on('progress', function (value) {
        progressBar.clear();
        progressBar.fillStyle(0x87CEEB, 1);
        progressBar.fillRect(90, 330, 220 * value, 30);
    });

    this.load.on('complete', function () {
        progressBar.destroy();
        progressBox.destroy();
        loadingText.destroy();
    });

    this.load.image('mapBG_start', 'novgorod_map_start.png');
    this.load.image('mapBG_final', 'novgorod_map_final.png');
    this.load.image('prichal_icon', 'prichal_icon.png');
    this.load.image('za_rekoy_icon', 'za_rekoy_icon.png');
    this.load.image('novgorod_icon', 'novgorod_icon.png');
    this.load.image('prichal_puzzle', 'prichal_puzzle.png');
    this.load.image('za_rekoy_puzzle', 'za_rekoy_puzzle.png');
    this.load.image('novgorod_puzzle', 'novgorod_puzzle.png');
    this.load.image('bochki55', 'bochki_220.png');
    this.load.image('gusli55', 'gusli_220.png');
    this.load.image('kirpich55', 'kirpich_220.png');
    this.load.image('pero55', 'pero_220.png');
    this.load.image('pisalo55', 'pisalo_220.png');
    this.load.image('zhenya', 'zhenya.png');
    this.load.image('zhenya_boat', 'zhenya_boat.png');
    this.load.image('zhenya_sadko_boat', 'zhenya_sadko_boat.png');
    this.load.image('starets', 'starets.png');
    this.load.image('sadko', 'sadko.png');
    this.load.image('prolog', 'prolog_zasypanie.png');
    this.load.image('epilog', 'epilog_prosypanie.png');
    this.load.image('epilog_udivlenie', 'epilog_udivlenie.png');
    this.load.image('particle_star', 'particle_star.png');
    this.load.audio('bgMusic', 'bg_music.mp3');

    this.load.image('uzelok_art', 'uzelok_art.png');
    this.load.image('river_shell_art', 'river_shell_art.png');
    this.load.image('krestik_art', 'krestik_art.png');
}

function createGame() {
    this.cameras.main.roundPixels = true;
    if (!bgMusic) {
        bgMusic = this.sound.add('bgMusic', { loop: true, volume: 0.4 });
        bgMusic.play();
    }
    showPrologue.call(this);
}

function showPrologue() {
    var scene = this;
    scene.children.removeAll(true);
    var bg = scene.add.image(200, 350, 'prolog').setDisplaySize(400, 700);
    var text = scene.add.text(200, 600, 'Елисей заснул с книжкой былин...\nЕму снится Древний Новгород.\n\n[Нажми, чтобы продолжить]', {
        fontSize:'16px', fill:'#ffffff', align:'center', fontFamily:'Comfortaa, Arial', fontStyle:'bold',
        backgroundColor:'#000000aa', padding:{x:16,y:12}, stroke:'#000000', strokeThickness:2
    }).setOrigin(0.5);
    scene.input.once('pointerdown', function(){
        drawMap.call(scene);
    });
}

function showDialog(msg, portraitKey, showNextBtn, offsetY) {
    var scene = game.scene.scenes[0];
    if (dialogContainer) {
        dialogContainer.destroy();
        dialogContainer = null;
    }

    offsetY = offsetY || 0;

    var textStyle = { fontSize:'15px', fontFamily:'Comfortaa, Arial', fontStyle:'bold', fill:'#ffffff', align:'left', wordWrap:{width:200}, stroke:'#000000', strokeThickness:2 };
    var tmpText = scene.add.text(0, 0, msg, textStyle);
    var textWidth = tmpText.width;
    var textHeight = tmpText.height;
    tmpText.destroy();

    var paddingX = 20;
    var paddingY = 16;
    var bgWidth = textWidth + paddingX * 2;
    var bgHeight = textHeight + paddingY * 2;

    var bgCenterY = 590 + offsetY;
    var bgLeftX = 60;
    var bgCenterX = bgLeftX + bgWidth / 2;

    if (portraitKey) {
        bgLeftX = 130;
        bgCenterX = bgLeftX + bgWidth / 2;
    }

    dialogContainer = scene.add.container(0, 30);
    dialogContainer.setAlpha(0);

    var bg = scene.add.rectangle(bgCenterX, bgCenterY, bgWidth, bgHeight, 0x000000, 0.8);
    dialogContainer.add(bg);

    var dialogText = scene.add.text(bgLeftX + paddingX, bgCenterY - bgHeight/2 + paddingY, msg, textStyle);
    dialogContainer.add(dialogText);

    if (portraitKey) {
        var portraitX = (portraitKey === 'sadko') ? 80 : 70;
        var portrait = scene.add.image(portraitX, bgCenterY, portraitKey);
        if (portraitKey === 'sadko') {
            portrait.setDisplaySize(95, 180);
        } else {
            portrait.setDisplaySize(180, 180);
        }
        dialogContainer.add(portrait);
    }

    scene.tweens.add({
        targets: dialogContainer,
        alpha: 1,
        y: 0,
        duration: 400,
        ease: 'Power2'
    });

    if (playButton && !showNextBtn) {
        playButton.setVisible(true);
        playButton.setPosition(200, 310);
        if (playButton.customTween) {
            playButton.customTween.stop();
        }
        playButton.setAlpha(1);
        playButton.customTween = scene.tweens.add({
            targets: playButton,
            alpha: { from: 1, to: 0.65 },
            duration: 800,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });
    } else if (playButton) {
        playButton.setVisible(false);
        if (playButton.customTween) {
            playButton.customTween.stop();
            playButton.customTween = null;
        }
    }

    if (showNextBtn) {
        var nextBtn = scene.add.text(200, 310, 'ДАЛЕЕ', {
            fontSize:'22px', fill:'#ffd700', fontFamily:'Comfortaa, Arial', fontStyle:'bold',
            backgroundColor:'#333333', padding:{x:16,y:8}, stroke:'#000000', strokeThickness:2
        }).setOrigin(0.5).setInteractive();

        scene.tweens.add({
            targets: nextBtn,
            alpha: { from: 1, to: 0.65 },
            duration: 800,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });

        nextBtn.on('pointerdown', function(){
            dialogContainer.destroy();
            dialogContainer = null;
            if (playButton) playButton.setVisible(false);
            if (callbackAfterDialog) {
                callbackAfterDialog();
                callbackAfterDialog = null;
            }
            drawMap.call(scene);
        });

        dialogContainer.add(nextBtn);
    }
}

function hideDialog() {
    if (dialogContainer) {
        dialogContainer.destroy();
        dialogContainer = null;
    }
    if (playButton) {
        playButton.setVisible(false);
        if (playButton.customTween) {
            playButton.customTween.stop();
            playButton.customTween = null;
        }
    }
}

var callbackAfterDialog = null;

function resetIdleTimer() {
    if (idleTimer) {
        idleTimer.remove(false);
        idleTimer = null;
    }
    if (idleCloud) {
        idleCloud.destroy();
        idleCloud = null;
        idleActive = false;
    }
}

function resetPuzzleIdle() {
    if (puzzleIdleTimer) {
        puzzleIdleTimer.remove(false);
        puzzleIdleTimer = null;
    }
    clearPuzzleHints();
}

function clearPuzzleHints() {
    puzzleHintHighlights.forEach(function(frame) {
        frame.destroy();
    });
    puzzleHintHighlights = [];
}

function startPuzzleIdleHint(scene) {
    resetPuzzleIdle();
    if (!puzzleActive) return;

    puzzleIdleTimer = scene.time.delayedCall(15000, function() {
        if (!puzzleActive || dragIcon || dragLocked) return;

        clearPuzzleHints();

        var possibleMoves = [];
        for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
                // Проверяем обмен вправо
                if (c < COLS - 1) {
                    var c1 = grid[r][c];
                    var c2 = grid[r][c+1];
                    if (c1 && c2 && c1.artifactType !== c2.artifactType) {
                        possibleMoves.push({row: r, col: c, dir: 'right'});
                    }
                }
                // Проверяем обмен вниз
                if (r < ROWS - 1) {
                    var c1 = grid[r][c];
                    var c2 = grid[r+1][c];
                    if (c1 && c2 && c1.artifactType !== c2.artifactType) {
                        possibleMoves.push({row: r, col: c, dir: 'down'});
                    }
                }
            }
        }

        if (possibleMoves.length === 0) return;

        var move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
        var icon1 = grid[move.row][move.col];
        var icon2 = null;

        if (move.dir === 'right') {
            icon2 = grid[move.row][move.col + 1];
        } else {
            icon2 = grid[move.row + 1][move.col];
        }

        if (icon1 && icon2) {
            var hint1 = scene.add.rectangle(icon1.x, icon1.y, 82, 82);
            hint1.setStrokeStyle(3, 0xffff99);
            hint1.setFillStyle(0x000000, 0);
            puzzleHintHighlights.push(hint1);

            var hint2 = scene.add.rectangle(icon2.x, icon2.y, 82, 82);
            hint2.setStrokeStyle(3, 0xffff99);
            hint2.setFillStyle(0x000000, 0);
            puzzleHintHighlights.push(hint2);

            scene.tweens.add({
                targets: [hint1, hint2],
                alpha: { from: 0.4, to: 1 },
                duration: 600,
                yoyo: true,
                repeat: 3,
                onComplete: function() {
                    clearPuzzleHints();
                }
            });
        }
    });
}

function startIdleTimer(scene, playerX, playerY) {
    resetIdleTimer();

    var allCompleted = locations.every(function(l){ return l.completed; });
    var hints = [];

    if (puzzleActive) {
        // В пазле текстовые подсказки не показываем — там визуальный хинт
        return;
    } else if (allCompleted) {
        hints = ['Какой красивый храм…', 'Кажется, сон подходит к концу.', 'А что, если где-то спрятан секрет?'];
    } else if (locations[1].completed && !locations[2].completed) {
        hints = ['Какая сложная была битва…', 'Как нам повезло!', 'Куда теперь?'];
    } else if (!locations[0].completed) {
        hints = ['Надо идти к причалу…', 'Как я здесь оказался?', 'Как здесь красиво…'];
    } else {
        hints = ['Куда же дальше?', 'Кажется, пора в путь…', 'Сон продолжается…'];
    }

    var hint = hints[Math.floor(Math.random() * hints.length)];

    idleTimer = scene.time.delayedCall(12000, function() {
        if (isMoving || puzzleActive || dialogContainer) return;

        var style = {
            fontSize:'13px',
            fill:'#ffffff',
            fontFamily:'Comfortaa, Arial',
            fontStyle:'italic',
            backgroundColor:'#000000aa',
            padding:{x:10, y:6},
            stroke:'#000000',
            strokeThickness:2,
            align:'center'
        };
        idleCloud = scene.add.text(playerX, playerY - 80, hint, style).setOrigin(0.5).setAlpha(0);

        var cloudWidth = idleCloud.width;
        var leftEdge = playerX - cloudWidth / 2;
        var rightEdge = playerX + cloudWidth / 2;
        var newX = playerX;

        if (leftEdge < 10) {
            newX = 10 + cloudWidth / 2;
        } else if (rightEdge > 390) {
            newX = 390 - cloudWidth / 2;
        }

        if (newX !== playerX) {
            idleCloud.x = newX;
        }

        scene.tweens.add({ targets: idleCloud, alpha:1, duration:400, ease:'Power2' });
        idleActive = true;
    });
}

function drawMap() {
    this.children.removeAll(true);
    puzzleActive = false;
    if (bgMusic && !bgMusic.isPlaying) bgMusic.play();

    var allCompleted = locations.every(function(l){ return l.completed; });
    var mapKey = allCompleted ? 'mapBG_final' : 'mapBG_start';
    this.add.image(200, 350, mapKey).setDisplaySize(400, 700);

    var self = this;
    var activeLocs = locations.filter(function(l){ return l.unlocked && !l.completed; });

    if (!allCompleted) {
        locations.forEach(function(loc){
            if (!loc.unlocked) return;
            var icon = self.add.image(loc.x, loc.y, loc.icon);
            icon.setDisplaySize(80, 80);
            icon.setInteractive();
            if (loc.completed) icon.setAlpha(0.5);
            else icon.setAlpha(1.0);
            var txt = loc.name;
            var temp = self.add.text(0,0,txt,{ fontSize:'15px', fontFamily:'Comfortaa, Arial', fontStyle:'bold', fill:'#ffffff', stroke:'#000000', strokeThickness:4 });
            var tw=temp.width, th=temp.height; temp.destroy();
            var labelBg = self.add.rectangle(loc.x, loc.y+48, tw+12, th+8, 0x000000, 0.6).setOrigin(0.5);
            var labelText = self.add.text(loc.x, loc.y+48, txt, { fontSize:'15px', fontFamily:'Comfortaa, Arial', fontStyle:'bold', fill:'#ffffff', stroke:'#000000', strokeThickness:4 }).setOrigin(0.5);
            if (loc.completed) {
                labelBg.setAlpha(0.5);
                labelText.setAlpha(0.5);
            }
            loc.iconSprite = icon;
            loc.labelBg = labelBg;
            loc.labelText = labelText;

            if (activeLocs.length === 1 && loc.unlocked && !loc.completed) {
                self.tweens.add({
                    targets: icon,
                    alpha: { from: 1, to: 0.65 },
                    duration: 1000,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
            }

            icon.on('pointerdown', function(){
                if (isMoving || puzzleActive) return;
                if (loc.completed) return;
                if (lives <= 0 && !loc.isReturn) { showDialog('Нет жизней!'); return; }
                var localTweens = self.tweens.getTweensOf(icon);
                for (var i = 0; i < localTweens.length; i++) {
                    localTweens[i].stop();
                }
                var needsPuzzle = !loc.completed && !loc.isReturn;
                movePlayerTo(loc.x, loc.y, loc, needsPuzzle);
            });
        });
    }

    var startX = lastPlayerLoc ? lastPlayerLoc.x : 50;
    var startY = lastPlayerLoc ? lastPlayerLoc.y : 350;
    if (allCompleted) {
        startX = 50;
        startY = 350;
        lastPlayerLoc = {x: 50, y: 350};
    }
    playerContainer = this.add.container(startX, startY);
    var spriteKey = 'zhenya';
    if (locations[1].completed && !locations[2].completed && !locations[0].completed) spriteKey = 'zhenya_sadko_boat';
    else if (locations[0].completed && !locations[1].completed) spriteKey = 'zhenya_boat';
    var currentSprite = this.add.image(0,0,spriteKey);
    if (spriteKey === 'zhenya_sadko_boat') {
        currentSprite.setDisplaySize(137, 120);
    } else {
        currentSprite.setDisplaySize(120, 120);
    }
    playerContainer.add(currentSprite);
    playerContainer.currentSprite = currentSprite;

    dialogContainer = null;
    playButton = this.add.text(200, 310, 'ИГРАТЬ', { fontSize:'22px', fill:'#ffd700', fontFamily:'Comfortaa, Arial', fontStyle:'bold', backgroundColor:'#333333', padding:{x:16,y:8}, stroke:'#000000', strokeThickness:2 }).setOrigin(0.5).setInteractive().setVisible(false);
    playButton.customTween = null;
    playButton.on('pointerdown', function(){ if(currentLocation && !currentLocation.completed) startPuzzle(currentLocation); });

    musicBtn = this.add.text(380, 10, musicOn ? '🔊' : '🔇', { fontSize:'24px' }).setOrigin(1,0).setInteractive();
    musicBtn.on('pointerdown', function(){
        musicOn = !musicOn;
        if (bgMusic) bgMusic.setVolume(musicOn ? 0.4 : 0);
        musicBtn.setText(musicOn ? '🔊' : '🔇');
    });

    livesText = this.add.text(340, 45, '❤️ x '+lives, { fontSize:'18px', fill:'#ffffff', fontFamily:'Comfortaa, Arial', fontStyle:'bold', stroke:'#000000', strokeThickness:3 });

    if (allCompleted) {
        if (!finalDialogShown) {
            finalDialogShown = true;
            callbackAfterDialog = function() {};
            showDialog('Вот и построен храм, Елисей! Ты спас меня и помог завершить это благое дело. Спасибо тебе за всё, что ты сделал!', 'sadko', true, -50);
            return;
        }

        var dreamBtn = this.add.text(200, 670, '🌟 Проснуться 🌟', {
            fontSize:'18px', fill:'#ffd700', fontFamily:'Comfortaa, Arial', fontStyle:'bold',
            backgroundColor:'#333333', padding:{x:12,y:6}, stroke:'#000000', strokeThickness:2
        }).setOrigin(0.5).setInteractive();

        this.tweens.add({
            targets: dreamBtn,
            alpha: { from: 1, to: 0.65 },
            duration: 800,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });

        dreamBtn.on('pointerdown', function(){ showEnding(); });

        var secretZone = this.add.rectangle(350, 130, 60, 60, 0x000000, 0.01).setInteractive();
        secretZone.on('pointerdown', function(pointer) {
            if (!secretFound) {
                secretFound = true;
                var emitter = self.add.particles(350, 130, 'particle_star', {
                    speed: { min: -150, max: 150 },
                    angle: { min: 0, max: 360 },
                    scale: { start: 0.8, end: 0 },
                    lifespan: 600,
                    quantity: 12,
                    emitting: false
                });
                emitter.explode();

                showDialog('Ты нашёл секрет!\nЭта игра создана участником одиночной экспедиции\nЕвгением Кутузовым\nво время подготовки к историческому маршруту\n«Круг Ладоги».\n\nПосвящается всем любителям приключений.', null, true, -100);
            }
        });
    }

    var hintText = allCompleted ? 'Нажми «Проснуться»' : (function(){
        if (activeLocs.length === 1) {
            return 'Нажми на иконку «' + activeLocs[0].name + '»';
        }
        return 'Выбери локацию';
    })();
    var htemp = this.add.text(0,0,hintText,{ fontSize:'14px', fill:'#ffffff', align:'center', fontFamily:'Comfortaa, Arial', fontStyle:'bold', stroke:'#000000', strokeThickness:3 });
    var hw=htemp.width, hh=htemp.height; htemp.destroy();
    var hintX = allCompleted ? 240 : 220;
    this.add.rectangle(hintX, 28, hw+16, hh+10, 0x000000, 0.6).setOrigin(0.5);
    mapHintText = this.add.text(hintX, 28, hintText, { fontSize:'14px', fill:'#ffffff', align:'center', fontFamily:'Comfortaa, Arial', fontStyle:'bold', stroke:'#000000', strokeThickness:3 }).setOrigin(0.5);

    resetIdleTimer();
    this.input.on('pointerdown', function() {
        resetIdleTimer();
        startIdleTimer(self, startX, startY);
    });
    startIdleTimer(self, startX, startY);
}

function movePlayerTo(tx, ty, location, needsPuzzle) {
    isMoving = true;
    hideDialog();
    resetIdleTimer();
    currentLocation = null;
    tx=Math.round(tx); ty=Math.round(ty);
    lastPlayerLoc = {x: tx, y: ty};

    if (location && !location.completed) {
        location.iconSprite.setAlpha(0.5);
        if (location.labelBg) location.labelBg.setAlpha(0.5);
        if (location.labelText) location.labelText.setAlpha(0.5);
    }

    var scene = game.scene.scenes[0];
    var duration = 800;
    if (location) {
        if (location.name === 'За рекой') duration = 2000;
        else if (location.name === 'Причал' && locations[1].completed) duration = 2000;
        else if (location.name === 'Великий Новгород' && locations[1].completed) duration = 2000;
    }

    scene.tweens.add({ targets:playerContainer, x:tx, y:ty, duration:duration, ease:'Power2', onComplete:function(){
        isMoving = false;
        if (!location) return;
        currentLocation = location;

        if (location.name === 'Причал' && locations[1].completed && !locations[2].unlocked) {

    mTmp.destroy();

    var helpBtn = scene.add.text(40, 30, '?', {
        fontSize:'20px', fill:'#ffffff', fontFamily:'Comfortaa, Arial', fontStyle:'bold',
        backgroundColor:'#333333', padding:{x:6,y:4}
    }).setOrigin(0,0).setInteractive();
    helpBtn.on('pointerdown', showTutorial);

    var musicBtnLevel = scene.add.text(380, 30, musicOn ? '🔊' : '🔇', { fontSize:'24px' }).setOrigin(1,0).setInteractive();
    musicBtnLevel.on('pointerdown', function(){

        if (bgMusic) bgMusic.setVolume(musicOn ? 0.4 : 0);
        musicBtnLevel.setText(musicOn ? '🔊' : '🔇');
        if (musicBtn) musicBtn.setText(musicOn ? '🔊' : '🔇');
    });

    for (var row = 0; row < ROWS; row++) {
        grid[row] = [];
        for (var col = 0; col < COLS; col++) {
            var typeKey = TYPE_KEYS[Math.floor(Math.random() * TYPE_KEYS.length)];
            var x = startX + col * CELL_SIZE + CELL_SIZE / 2;
            var y = startY + row * CELL_SIZE + CELL_SIZE / 2;
            var icon = scene.add.image(x, y, TYPES[typeKey].img);
            icon.setDisplaySize(80, 80);
            icon.texture.setFilter(Phaser.Textures.FilterMode.NEAREST);
            icon.setInteractive();
            icon.row = row; icon.col = col; icon.artifactType = typeKey;
            icon.on('pointerdown', onDragStart);
            grid[row][col] = icon;
        }
    }

    (function cleanUp() {
        var found = false;
        for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS - 2; c++) {
                var a = grid[r][c];
                if (a && grid[r][c+1] && grid[r][c+2] &&
                    a.artifactType === grid[r][c+1].artifactType &&
                    a.artifactType === grid[r][c+2].artifactType) {
                    grid[r][c].destroy(); grid[r][c] = null;
                    grid[r][c+1].destroy(); grid[r][c+1] = null;
                    grid[r][c+2].destroy(); grid[r][c+2] = null;
                    found = true;
                }
            }
        }
        for (var c = 0; c < COLS; c++) {
            for (var r = 0; r < ROWS - 2; r++) {
                var a = grid[r][c];
                if (a && grid[r+1][c] && grid[r+2][c] &&
                    a.artifactType === grid[r+1][c].artifactType &&
                    a.artifactType === grid[r+2][c].artifactType) {
                    grid[r][c].destroy(); grid[r][c] = null;
                    grid[r+1][c].destroy(); grid[r+1][c] = null;
                    grid[r+2][c].destroy(); grid[r+2][c] = null;
                    found = true;
                }
            }
        }
        if (found) {
            for (var c = 0; c < COLS; c++) {
                var emptyRow = ROWS - 1;
                for (var r = ROWS - 1; r >= 0; r--) {
                    if (grid[r][c] !== null) {
                        if (r !== emptyRow) {
                            grid[emptyRow][c] = grid[r][c];
                            grid[r][c] = null;
                            grid[emptyRow][c].row = emptyRow;
                            grid[emptyRow][c].col = c;
                            grid[emptyRow][c].y = startY + emptyRow * CELL_SIZE + CELL_SIZE / 2;
                        }
                        emptyRow--;
                    }
                }
            }
            for (var c = 0; c < COLS; c++) {
                for (var r = 0; r < ROWS; r++) {
                    if (grid[r][c] === null) {
                        var typeKey = TYPE_KEYS[Math.floor(Math.random() * TYPE_KEYS.length)];
                        var x = startX + c * CELL_SIZE + CELL_SIZE / 2;
                        var y = startY + r * CELL_SIZE + CELL_SIZE / 2;
                        var icon = scene.add.image(Math.round(x), Math.round(y), TYPES[typeKey].img);
                        icon.setDisplaySize(80, 80);
                        icon.texture.setFilter(Phaser.Textures.FilterMode.NEAREST);
                        icon.setInteractive();
                        icon.row = r; icon.col = c; icon.artifactType = typeKey;
                        icon.on('pointerdown', onDragStart);
                        grid[r][c] = icon;
                    }
                }
            }
            cleanUp();
        }
    })();

    scene.time.delayedCall(200, highlightTargets);

    var backBtn = scene.add.text(200, 660, 'Вернуться на карту', {
        fontSize:'14px', fill:'#ffffff', fontFamily:'Comfortaa, Arial', fontStyle:'bold',
        backgroundColor:'#333333', padding:{x:8,y:4}, stroke:'#000000', strokeThickness:2
    }).setOrigin(0.5).setInteractive();
    backBtn.on('pointerdown', function(){
        puzzleActive = false;
        drawMap.call(scene);
    });

    scene.input.on('pointerdown', function() {
        resetPuzzleIdle();
        startPuzzleIdleHint(scene);
    });
    startPuzzleIdleHint(scene);
}

function onDragStart(pointer) {
    if (!puzzleActive || dragIcon || dragLocked) return;
    resetPuzzleIdle();
    var icon = this;
    dragIcon = icon;
    dragStartX = icon.x; dragStartY = icon.y;
    dragPointerStartX = pointer.x; dragPointerStartY = pointer.y;
    icon.setTint(0xdddddd);
    document.body.style.overflow = 'hidden';
    var scene = game.scene.scenes[0];
    scene.input.on('pointermove', onDragMove);
    scene.input.on('pointerup', onDragEnd);
}

function onDragMove(pointer) {
    if (!dragIcon) return;
    dragIcon.x = dragStartX + pointer.x - dragPointerStartX;
    dragIcon.y = dragStartY + pointer.y - dragPointerStartY;
}

function onDragEnd(pointer) {
    if (!dragIcon) return;
    var scene = game.scene.scenes[0];
    scene.input.off('pointermove', onDragMove);
    scene.input.off('pointerup', onDragEnd);
    var dx = pointer.x - dragPointerStartX;
    var dy = pointer.y - dragPointerStartY;
    var threshold = CELL_SIZE * 0.6;

    if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
        var targetRow = dragIcon.row, targetCol = dragIcon.col;
        if (Math.abs(dx) > Math.abs(dy)) {
            targetCol += (dx > 0) ? 1 : -1;
        } else {
            targetRow += (dy > 0) ? 1 : -1;
        }
        if (targetRow >= 0 && targetRow < ROWS && targetCol >= 0 && targetCol < COLS) {
            var targetIcon = grid[targetRow][targetCol];
            if (targetIcon) {
                swapIcons(dragIcon, targetIcon);
                dragIcon.clearTint();
                dragIcon = null;
                document.body.style.overflow = 'auto';
                dragLocked = true;

                if (!firstMoveMade) {
                    firstMoveMade = true;
                    clearHighlights();
                }

                scene.time.delayedCall(200, function(){ dragLocked = false; });
                startPuzzleIdleHint(scene);
                return;
            }
        }
    }
    dragIcon.clearTint();
    dragIcon.x = dragStartX;
    dragIcon.y = dragStartY;
    dragIcon = null;
    document.body.style.overflow = 'auto';
    dragLocked = true;
    scene.time.delayedCall(200, function(){ dragLocked = false; });
    startPuzzleIdleHint(scene);
}

function swapIcons(c1, c2) {
    var r1 = c1.row, c1c = c1.col;
    var r2 = c2.row, c2c = c2.col;
    grid[r1][c1c] = c2; grid[r2][c2c] = c1;
    c1.row = r2; c1.col = c2c; c2.row = r1; c2.col = c1c;
    var scene = game.scene.scenes[0];
    var gw = COLS * CELL_SIZE, gh = ROWS * CELL_SIZE;
    var sx = Math.round((400 - gw) / 2), sy = Math.round((700 - gh) / 2 + 20);
    scene.tweens.add({ targets: c1, x: sx + c1.col * CELL_SIZE + CELL_SIZE/2, y: sy + c1.row * CELL_SIZE + CELL_SIZE/2, duration: 150 });
    scene.tweens.add({ targets: c2, x: sx + c2.col * CELL_SIZE + CELL_SIZE/2, y: sy + c2.row * CELL_SIZE + CELL_SIZE/2, duration: 150 });
    movesLeft--;
    if (movesText) { movesText.setText('Ходы: ' + movesLeft); movesText.setStyle({ fill: movesLeft <= 5 ? '#ff6666' : '#ffffff' }); }
    scene.time.delayedCall(180, checkMatches);
}

function checkMatches(isInitial) {
    var toRemove = [];
    for (var r=0; r<ROWS; r++) {
        for (var c=0; c<COLS-2; c++) {
            var a = grid[r][c]; if (!a) continue;
            if (a.artifactType === grid[r][c+1]?.artifactType && a.artifactType === grid[r][c+2]?.artifactType)
                toRemove.push(a, grid[r][c+1], grid[r][c+2]);
        }
    }
    for (var c=0; c<COLS; c++) {
        for (var r=0; r<ROWS-2; r++) {
            var a = grid[r][c]; if (!a) continue;
            if (a.artifactType === grid[r+1]?.[c]?.artifactType && a.artifactType === grid[r+2]?.[c]?.artifactType)
                toRemove.push(a, grid[r+1][c], grid[r+2][c]);
        }
    }
    if (toRemove.length > 0) {
        if (isInitial) {
            toRemove.forEach(function(icon){
                if (!icon) return;
                icon.destroy();
                grid[icon.row][icon.col] = null;
            });
            fillEmptySpaces(true);
        } else {
            removeMatches(toRemove);
        }
    } else if (!isInitial && movesLeft <= 0) loseLevel();
}

function removeMatches(matches) {
    var scene = game.scene.scenes[0];
    matches.forEach(function(icon){
        if (!icon) return;
        if (icon.artifactType === targetType) {
            collectedCount++;
            var tp = TYPES[targetType].plural;
            scoreText.setText('Собрано ' + tp + ': ' + collectedCount + ' / ' + targetCount);

            var emitter = scene.add.particles(icon.x, icon.y, 'particle_star', {
                speed: { min: -120, max: 120 },
                angle: { min: 0, max: 360 },
                scale: { start: 0.6, end: 0 },
                lifespan: 500,
                quantity: 8,
                emitting: false
            });
            emitter.explode();
        }
        scene.tweens.add({ targets: icon, scaleX:0, scaleY:0, alpha:0, duration:200, onComplete: function(){ icon.destroy(); } });
        grid[icon.row][icon.col] = null;
    });
    scene.time.delayedCall(300, fillEmptySpaces);
}

function fillEmptySpaces(isInitial) {
    var scene = game.scene.scenes[0];
    var gw = COLS * CELL_SIZE, gh = ROWS * CELL_SIZE;
    var sx = Math.round((400 - gw) / 2), sy = Math.round((700 - gh) / 2 + 20);
    for (var c=0; c<COLS; c++) {
        var emptyRow = ROWS-1;
        for (var r=ROWS-1; r>=0; r--) {
            if (grid[r][c] !== null) {
                if (r !== emptyRow) {
                    grid[emptyRow][c] = grid[r][c]; grid[r][c] = null;
                    grid[emptyRow][c].row = emptyRow; grid[emptyRow][c].col = c;
                    scene.tweens.add({ targets: grid[emptyRow][c], y: sy + emptyRow * CELL_SIZE + CELL_SIZE/2, duration: isInitial ? 0 : 200 });
                }
                emptyRow--;
            }
        }
    }
    for (var c=0; c<COLS; c++) {
        for (var r=0; r<ROWS; r++) {
            if (grid[r][c] === null) {
                var typeKey = TYPE_KEYS[Math.floor(Math.random() * TYPE_KEYS.length)];
                var x = sx + c * CELL_SIZE + CELL_SIZE/2, y = sy + r * CELL_SIZE + CELL_SIZE/2;
                var icon = scene.add.image(Math.round(x), Math.round(y), TYPES[typeKey].img);
                icon.setDisplaySize(80, 80);
                icon.texture.setFilter(Phaser.Textures.FilterMode.NEAREST);
                icon.setInteractive();
                icon.row = r; icon.col = c; icon.artifactType = typeKey;
                icon.on('pointerdown', onDragStart); grid[r][c] = icon;
            }
        }
    }
    if (isInitial) {
        checkMatches(true);
    } else if (collectedCount >= targetCount) {
        puzzleActive = false;
        if (currentLocation) {
            currentLocation.completed = true;
            if (currentLocation.name === 'Причал' && !locations[1].completed) artifactCollected.uzelok = true;
            else if (currentLocation.name === 'За рекой') { artifactCollected.rakuska = true; locations[1].completed = true; }
            else if (currentLocation.name === 'Великий Новгород') { artifactCollected.krestik = true; }
            unlockNext(currentLocation);
            updatePlayerSprite(currentLocation);

            // Визуальная награда: показываем иконку артефакта над локацией
            var artifactImg = '';
            if (currentLocation.name === 'Причал') artifactImg = 'uzelok_art';
            else if (currentLocation.name === 'За рекой') artifactImg = 'river_shell_art';
            else if (currentLocation.name === 'Великий Новгород') artifactImg = 'krestik_art';

            var locX = currentLocation.x || 200;
            var locY = currentLocation.y || 300;
            // Иконка побольше (80x80) и дольше (3 секунды)
            var rewardIcon = scene.add.image(locX, locY - 40, artifactImg).setDisplaySize(80, 80).setAlpha(0).setDepth(10);
            scene.tweens.add({ targets: rewardIcon, alpha: 1, y: locY - 80, duration: 400, ease: 'Power2' });
            scene.tweens.add({ targets: rewardIcon, alpha: 0, delay: 3000, duration: 400, onComplete: function() {
                rewardIcon.destroy();
            }});

            var factText = scene.add.text(200, 380, '✅ Миссия выполнена!', {
                fontSize:'15px', fill:'#ffffff', align:'center', wordWrap:{width:340},
                backgroundColor:'#000000cc', padding:{x:12,y:12},
                fontFamily:'Comfortaa, Arial', fontStyle:'bold', stroke:'#000000', strokeThickness:3
            }).setOrigin(0.5);
            scene.time.delayedCall(2500, function(){
                factText.destroy();
                drawMap.call(scene);
            });
        }
    } else if (!isInitial && movesLeft <= 0) loseLevel();
    else if (!isInitial) scene.time.delayedCall(200, checkMatches);
}

function unlockNext(loc) {
    if (loc.name === 'Причал' && !locations[1].unlocked) {
        locations[1].unlocked = true;
    } else if (loc.name === 'За рекой') {
        locations[0].isReturn = true;
        locations[1].completed = true;
        locations[0].completed = false;
    }
}

function updatePlayerSprite(completedLocation) {
    if (!playerContainer) return;
    var oldSprite = playerContainer.currentSprite;
    if (!oldSprite) return;
    var newKey = 'zhenya';
    if (completedLocation.name === 'Причал' && !locations[1].completed) {
        newKey = 'zhenya_boat';
        if (playerContainer) {
            playerContainer.y = 400;
            lastPlayerLoc = {x: playerContainer.x, y: 400};
        }
    } else if (completedLocation.name === 'За рекой') {
        newKey = 'zhenya_sadko_boat';
        if (playerContainer) {
            playerContainer.x = locations[1].x;
            playerContainer.y = locations[1].y;
            lastPlayerLoc = {x: locations[1].x, y: locations[1].y};
        }
    } else if (completedLocation.name === 'Причал' && locations[1].completed && !locations[2].completed) {
        newKey = 'zhenya';
    }
    if (oldSprite.texture.key === newKey) return;
    var scene = game.scene.scenes[0];
    playerContainer.remove(oldSprite, true);
    var newSprite = scene.add.image(0,0, newKey);
    if (newKey === 'zhenya_sadko_boat') {
        newSprite.setDisplaySize(137, 120);
    } else {
        newSprite.setDisplaySize(120, 120);
    }
    playerContainer.add(newSprite);
    playerContainer.currentSprite = newSprite;
}

function loseLevel() {
    puzzleActive = false;
    lives--;
    if (lives < 0) lives = 0;
    if (livesText) livesText.setText('❤️ x '+lives);
    if (lives <= 0) {
        showEnding();
        return;
    }
    var scene = game.scene.scenes[0];
    if (playerContainer) {
        playerContainer.x = 40;
        playerContainer.y = 450;
        lastPlayerLoc = {x: 40, y: 450};
    }
    var msg = 'Уровень провален! -1 жизнь.\nОсталось жизней: ' + lives;
    var loseText = scene.add.text(200,350,msg,{ fontSize:'20px',fill:'#ff6666',fontFamily:'Comfortaa, Arial',fontStyle:'bold', stroke:'#000000',strokeThickness:4,align:'center' }).setOrigin(0.5);
    scene.time.delayedCall(2500, function(){
        loseText.destroy();
        drawMap.call(scene);
    });
}
</script>
